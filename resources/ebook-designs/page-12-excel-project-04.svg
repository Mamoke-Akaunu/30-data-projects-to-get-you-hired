<rect x="25" y="656" width="462" height="37" rx="11" fill="url(#row)" stroke="#37e8dc" stroke-width="1.2"/><rect x="34" y="661" width="33" height="27" rx="14" fill="#00623c" stroke="#3cfaad" stroke-width="1.5"/><text x="40" y="680" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700" fill="#fff"><tspan x="40" dy="0">04</tspan></text><text x="80" y="670" font-family="Arial,Helvetica,sans-serif" font-size="10.9" font-weight="500" fill="#f7ffff"><tspan x="80" dy="0">Among data roles, what proportions are Remote,</tspan><tspan x="80" dy="13">Hybrid, On-site or Unknown?</tspan></text>
