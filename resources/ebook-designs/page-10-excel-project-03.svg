<text x="38" y="408" font-family="Arial,Helvetica,sans-serif" font-size="13.2" font-weight="700" fill="#fff"><tspan x="38" dy="0">marketing_campaign_data_messy.csv</tspan></text>
<text x="38" y="425" font-family="Arial,Helvetica,sans-serif" font-size="10.5" font-weight="400" fill="#b9d1e6"><tspan x="38" dy="0">2,020 campaigns rows  ·  12 fields  ·  intentionally messy</tspan></text>
