<text x="271" y="486" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#e8f6ff"><tspan x="271" dy="0">• Cleaned Excel workbook</tspan></text>
<text x="271" y="502" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#e8f6ff"><tspan x="271" dy="0">• Channel comparison</tspan></text>
<text x="271" y="518" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="400" fill="#e8f6ff"><tspan x="271" dy="0">• KPI summary &amp; charts</tspan></text>
