<text x="38" y="220" font-family="Arial,Helvetica,sans-serif" font-size="11.8" font-weight="400" fill="#e8f6ff"><tspan x="38" dy="0">You are a Junior Marketing Performance Analyst. Your</tspan></text>
<text x="38" y="238" font-family="Arial,Helvetica,sans-serif" font-size="11.8" font-weight="400" fill="#e8f6ff"><tspan x="38" dy="0">manager needs reliable campaign spend and engagement</tspan></text>
<text x="38" y="256" font-family="Arial,Helvetica,sans-serif" font-size="11.8" font-weight="400" fill="#e8f6ff"><tspan x="38" dy="0">metrics before allocating the next advertising budget.</tspan></text>
<text x="38" y="275" font-family="Arial,Helvetica,sans-serif" font-size="11.8" font-weight="400" fill="#e8f6ff"><tspan x="38" dy="0">Clean the export and compare channel effectiveness.</tspan></text>
