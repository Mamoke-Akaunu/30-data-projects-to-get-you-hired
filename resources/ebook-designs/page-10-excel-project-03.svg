<rect x="24" y="570" width="464" height="42" rx="12" fill="#092d3b" stroke="#24c9ce" stroke-width="1.4"/><rect x="35" y="578" width="29" height="26" rx="13" fill="#00634f" stroke="#49e8b8" stroke-width="1.3"/><text x="42" y="596" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#f7ffff"><tspan x="42" dy="0">01</tspan></text><text x="76" y="585" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#edf9ff"><tspan x="76" dy="0">Audit duplicate records, repeated IDs, missing conversions,</tspan><tspan x="76" dy="13.2">unknown channels, negative spend and invalid date ranges.</tspan></text>
<rect x="24" y="615" width="464" height="42" rx="12" fill="#092d3b" stroke="#24c9ce" stroke-width="1.4"/><rect x="35" y="623" width="29" height="26" rx="13" fill="#00634f" stroke="#49e8b8" stroke-width="1.3"/><text x="42" y="641" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#f7ffff"><tspan x="42" dy="0">02</tspan></text><text x="76" y="630" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#edf9ff"><tspan x="76" dy="0">Standardise Channel and Active; select the correct primary</tspan><tspan x="76" dy="13.2">Clicks field without double-counting the second column.</tspan></text>
<rect x="24" y="660" width="464" height="42" rx="12" fill="#092d3b" stroke="#24c9ce" stroke-width="1.4"/><rect x="35" y="668" width="29" height="26" rx="13" fill="#00634f" stroke="#49e8b8" stroke-width="1.3"/><text x="42" y="686" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#f7ffff"><tspan x="42" dy="0">03</tspan></text><text x="76" y="675" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#edf9ff"><tspan x="76" dy="0">How many distinct campaigns exist overall and in each</tspan><tspan x="76" dy="13.2">cleaned channel? Keep unknown channels separate.</tspan></text>
<rect x="24" y="705" width="464" height="42" rx="12" fill="#092d3b" stroke="#24c9ce" stroke-width="1.4"/><rect x="35" y="713" width="29" height="26" rx="13" fill="#00634f" stroke="#49e8b8" stroke-width="1.3"/><text x="42" y="731" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#f7ffff"><tspan x="42" dy="0">04</tspan></text><text x="76" y="720" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#edf9ff"><tspan x="76" dy="0">Which channels have the most valid nonnegative spend,</tspan><tspan x="76" dy="13.2">and what share of the total do they represent?</tspan></text>
<rect x="24" y="750" width="464" height="37" rx="12" fill="#063545" stroke="#24c9ce" stroke-width="1.4"/>
<rect x="35" y="756" width="29" height="25" rx="12" fill="#00634f" stroke="#49e8b8" stroke-width="1.3"/>
<text x="42" y="774" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="700" fill="#f7ffff"><tspan x="42" dy="0">05</tspan></text>
<text x="76" y="766" font-family="Arial,Helvetica,sans-serif" font-size="11.2" font-weight="400" fill="#edf9ff"><tspan x="76" dy="0">Calculate CTR = total valid clicks ÷ valid impressions</tspan></text>
<text x="76" y="779" font-family="Arial,Helvetica,sans-serif" font-size="11.2" font-weight="400" fill="#edf9ff"><tspan x="76" dy="0">by channel; identify highest and lowest.</tspan></text>
