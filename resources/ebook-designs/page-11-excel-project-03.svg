<text x="195" y="611" font-family="Arial,Helvetica,sans-serif" font-size="13.3" font-weight="700" fill="#fae9ff"><tspan x="195" dy="0">TIPS</tspan></text>
<text x="195" y="634" font-family="Arial,Helvetica,sans-serif" font-size="10.8" font-weight="400" fill="#f4fbff"><tspan x="195" dy="0">• Use ratios of sums</tspan></text>
