<rect x="24" y="221" width="464" height="63" rx="12" stroke="#2cdece" fill="url(#qbg)" stroke-width="1.65"/><rect x="35" y="236" width="41" height="32" rx="15" fill="url(#qnum)" stroke="#42f5bb" stroke-width="1.5"/><text x="44" y="258" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff"><tspan x="44" dy="0">06</tspan></text><text x="90" y="240" font-family="Arial,Helvetica,sans-serif" font-size="12.3" font-weight="700" fill="#46f5dc"><tspan x="90" dy="0">COST PER CLICK (CPC)</tspan></text><text x="90" y="256" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#f5fcff"><tspan x="90" dy="0">By channel, divide eligible nonnegative spend by valid</tspan><tspan x="90" dy="13.2">positive clicks. Compare low and high CPC values.</tspan></text>
<rect x="24" y="291" width="464" height="63" rx="12" stroke="#2cdece" fill="url(#qbg)" stroke-width="1.65"/><rect x="35" y="306" width="41" height="32" rx="15" fill="url(#qnum)" stroke="#42f5bb" stroke-width="1.5"/><text x="44" y="328" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff"><tspan x="44" dy="0">07</tspan></text><text x="90" y="310" font-family="Arial,Helvetica,sans-serif" font-size="12.3" font-weight="700" fill="#46f5dc"><tspan x="90" dy="0">CONVERSION RATE</tspan></text><text x="90" y="326" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#f5fcff"><tspan x="90" dy="0">By channel, divide valid conversions by positive clicks</tspan><tspan x="90" dy="13.2">on the same rows. Exclude missing conversions.</tspan></text>
<rect x="24" y="361" width="464" height="63" rx="12" stroke="#2cdece" fill="url(#qbg)" stroke-width="1.65"/><rect x="35" y="376" width="41" height="32" rx="15" fill="url(#qnum)" stroke="#42f5bb" stroke-width="1.5"/><text x="44" y="398" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff"><tspan x="44" dy="0">08</tspan></text><text x="90" y="380" font-family="Arial,Helvetica,sans-serif" font-size="12.3" font-weight="700" fill="#46f5dc"><tspan x="90" dy="0">COST PER CONVERSION (CPA)</tspan></text><text x="90" y="396" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#f5fcff"><tspan x="90" dy="0">Divide eligible nonnegative spend by valid positive</tspan><tspan x="90" dy="13.2">conversions per channel. Which has the lowest CPA?</tspan></text>
<rect x="24" y="431" width="464" height="63" rx="12" stroke="#2cdece" fill="url(#qbg)" stroke-width="1.65"/><rect x="35" y="446" width="41" height="32" rx="15" fill="url(#qnum)" stroke="#42f5bb" stroke-width="1.5"/><text x="44" y="468" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff"><tspan x="44" dy="0">09</tspan></text><text x="90" y="450" font-family="Arial,Helvetica,sans-serif" font-size="12.3" font-weight="700" fill="#46f5dc"><tspan x="90" dy="0">ACTIVE VS INACTIVE CAMPAIGNS</tspan></text><text x="90" y="466" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#f5fcff"><tspan x="90" dy="0">Compare campaign counts, valid spend, CTR and CPA for</tspan><tspan x="90" dy="13.2">standardised statuses. Do not infer causation.</tspan></text>
<rect x="24" y="501" width="464" height="63" rx="12" stroke="#2cdece" fill="url(#qbg)" stroke-width="1.65"/><rect x="35" y="516" width="41" height="32" rx="15" fill="url(#qnum)" stroke="#42f5bb" stroke-width="1.5"/><text x="44" y="538" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#fff"><tspan x="44" dy="0">10</tspan></text><text x="90" y="520" font-family="Arial,Helvetica,sans-serif" font-size="12.3" font-weight="700" fill="#46f5dc"><tspan x="90" dy="0">FINAL EXCEL DASHBOARD</tspan></text><text x="90" y="536" font-family="Arial,Helvetica,sans-serif" font-size="11.1" font-weight="500" fill="#f5fcff"><tspan x="90" dy="0">Include spend, clicks, conversions, CTR, CPC and CPA;</tspan><tspan x="90" dy="13.2">channel/status filters; and three practical recommendations.</tspan></text>
